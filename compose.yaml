#ADD LOADBALANCER
services:
  db:
    container_name: postgres
    image: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=pokemark
      - PGDATA=/data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis
    command: redis-server --requirepass Redis2026!
    ports:
      - "6379:6379"

networks:
  db:
    driver: bridge
  redis:
    driver: bridge

volumes:
  db:
  redis:
